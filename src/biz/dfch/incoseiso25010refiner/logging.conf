[loggers]
keys=root

[handlers]
keys=fileHandler,richHandler

[formatters]
keys=defaultFormatter,richFormatter

[logger_root]
level=DEBUG
handlers=fileHandler,richHandler

[handler_richHandler]
class=rich.logging.RichHandler
level=DEBUG
formatter=richFormatter
args=()
kwargs={"log_time_format": "%%Y-%%m-%%d %%H:%%M:%%S", "rich_tracebacks": 'True', "markup": 'True', "show_path": 'True'}

[handler_consoleHandler]
class=StreamHandler
level=ERROR
formatter=defaultFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=defaultFormatter
args=('app.log', 'w')
encoding=utf-8

[formatter_richFormatter]  
# format=%(module)s - %(message)s
format=%(message)s

[formatter_defaultFormatter]
format=%(asctime)s - %(process)d - %(thread)d - %(levelname)s - %(module)s - %(message)s
