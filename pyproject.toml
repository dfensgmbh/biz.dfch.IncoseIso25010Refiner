[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# Note: also change "version" in `constant.py`.
# Note: also operate `uv lock`.
name = "biz-dfch-incoseiso25010refiner"
version = "0.1.0"
description = "An INCOSE and ISO25010 requirements refiner."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = [
    "LICENSE",
]
authors = [
    {name = "Ronald Rink"},
]
maintainers = [
    { name = "d-fens GmbH" },
]

keywords = [
    "INCOSE",
    "ISO25010",
    "requirements",
    "technical writing",
    "technical-writing",
    "text processing",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "accelerate>=1.13.0",
    "biz-dfch-ste100vocab>=0.5.0",
    "dacite>=1.9.2",
    "einops>=0.8.2",
    "instructor>=1.15.0",
    "litellm>=1.60.0",
    "pydantic>=2.10.0",
    "pydantic-ai>=0.0.20",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "rich>=14.0.0",
    "sentence-transformers>=5.5.1",
    "textual>=8.2.7",
    "typer>=0.25.1",
]

# Install with `uv`:
# uv sync --extra dev --extra build --python 3.13
# Examine if you can operate `unittest` correctly:
# uv run python -m unittest discover -v -s tests -t . -p "test_*.py"
# Examine if you can operate `ruff` correctly:
# uv run ruff check .
# uv run ruff format .
[project.optional-dependencies]
test = [
    "coverage",
    "parameterized>=0.9.0",
    "ruff>=0.11.0",
]

dev = [
    "biz-dfch-incoseiso25010refiner[test]",
    "pip>=26.1.1",
]

interactive = [
    "ipykernel",
]

build = [
    "pyinstaller>=6.20.0",
]

[project.urls]
Homepage = "https://github.com/dfensgmbh/biz.dfch.IncoseIso25010Refiner"
Issues = "https://github.com/dfensgmbh/biz.dfch.IncoseIso25010Refiner/issues"

[project.scripts]  
req = "main:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Rules: E/W = pycodestyle, F = pyflakes, I = isort, PL = pylint, UP = pyupgrade
select = ["E", "W", "F", "I", "PL", "UP"]
ignore = []

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[[tool.mypy.overrides]]
module = ["parameterized.*"]
ignore_missing_imports = true
